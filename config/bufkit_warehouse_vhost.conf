
<VirtualHost *:80>
    ServerName bufkitwarehouse.org
    ServerAlias www.bufkitwarehouse.org

    Redirect permanent / https://bufkitwarehouse.org/
</VirtualHost>

<VirtualHost *:443>
    ServerName bufkitwarehouse.org
    ServerAlias www.bufkitwarehouse.org
    SSLEngine on
    SSLProtocol all -SSLv2 -SSLv3
    SSLCipherSuite ALL:!ADH:!EXPORT:!SSLv2:RC4+RSA:+HIGH:+MEDIUM:+LOW
    SSLCertificateKeyFile /etc/letsencrypt/live/bufkitwarehouse.org/privkey.pem
    SSLCertificateChainFile /etc/letsencrypt/live/bufkitwarehouse.org/chain.pem
    SSLCertificateFile /etc/letsencrypt/live/bufkitwarehouse.org/cert.pem

    DocumentRoot /opt/bufkit_warehouse/htdocs

    include "/opt/bufkit_warehouse/config/bufkit_warehouse.inc"

</VirtualHost>
